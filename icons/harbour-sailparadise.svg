<?xml version="1.0" encoding="UTF-8"?>
<!-- SailParadise launcher icon, 86x86 Sailfish OS base grid.
     Base shape from the Sailfish OS app icon template (CC BY 3.0),
     motif inspired by the Radio Paradise headphones logo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="86" height="86" viewBox="0 0 86 86">
  <defs>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="0.7" y1="85.3" x2="85.3" y2="0.7">
      <stop offset="0" stop-color="#E9762B"/>
      <stop offset="1" stop-color="#FDC14A"/>
    </linearGradient>
  </defs>
  <!-- Base shape: "leaf", sharp top-right and bottom-left corners -->
  <path fill="url(#base)" d="M84.277,0.3H43C19.417,0.3,0.3,19.418,0.3,43v41.277c0,0.786,0.637,1.423,1.423,1.423H43
    c23.583,0,42.7-19.118,42.7-42.7V1.723C85.7,0.937,85.063,0.3,84.277,0.3z"/>
  <!-- Inset disc -->
  <circle fill="#FFF3DD" cx="43" cy="43" r="32.025"/>
  <!-- Headphones -->
  <g fill="#5E5E63">
    <path fill="none" stroke="#5E5E63" stroke-width="4.6" stroke-linecap="round" d="M21.500,47.000 A21.500,21.500 0 0,1 64.500,47.000"/>
    <!-- Ear cups: outer shell plus a slimmer pad facing inwards -->
    <rect x="14.6" y="46.0" width="7.4" height="17.0" rx="3.7"/>
    <rect x="21.2" y="43.6" width="6.4" height="21.8" rx="3.2"/>
    <rect x="64.0" y="46.0" width="7.4" height="17.0" rx="3.7"/>
    <rect x="58.4" y="43.6" width="6.4" height="21.8" rx="3.2"/>
  </g>
  <!-- Sound waves -->
  <g fill="none" stroke="#EFA422" stroke-width="2.4" stroke-linecap="round">
    <path d="M29.098,51.799 A5.200,5.200 0 0,1 29.098,58.201"/>
    <path d="M56.902,51.799 A5.200,5.200 0 0,0 56.902,58.201"/>
    <path d="M32.134,48.576 A9.600,9.600 0 0,1 32.134,61.424"/>
    <path d="M53.866,48.576 A9.600,9.600 0 0,0 53.866,61.424"/>
    <path d="M34.725,44.929 A14.000,14.000 0 0,1 34.725,65.071"/>
    <path d="M51.275,44.929 A14.000,14.000 0 0,0 51.275,65.071"/>
    <path d="M36.570,41.211 A18.000,18.000 0 0,1 36.570,68.789"/>
    <path d="M49.430,41.211 A18.000,18.000 0 0,0 49.430,68.789"/>
  </g>
  <g fill="#EFA422">
    <circle cx="28.2" cy="55.0" r="2.1"/>
    <circle cx="57.8" cy="55.0" r="2.1"/>
  </g>
</svg>
