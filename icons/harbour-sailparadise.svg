<?xml version="1.0" encoding="UTF-8"?>
<!-- SailParadise launcher icon, 86x86 Sailfish OS base grid.
     Base shape and layout from the Sailfish OS media player icon (CC BY 3.0),
     palette inspired by radioparadise.com (dark UI, amber/red accents). -->
<svg xmlns="http://www.w3.org/2000/svg" width="86" height="86" viewBox="0 0 86 86">
  <defs>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="12" y1="74" x2="80" y2="6">
      <stop offset="0" stop-color="#D9361F"/>
      <stop offset="0.55" stop-color="#F47A2E"/>
      <stop offset="1" stop-color="#FEB246"/>
    </linearGradient>
    <radialGradient id="disc" gradientUnits="userSpaceOnUse" cx="38" cy="36" r="36">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#121212"/>
    </radialGradient>
  </defs>
  <!-- Base shape: circle with a sharp top-right corner -->
  <path fill="url(#base)" d="M43,0.3H84.277c0.786,0,1.423,0.637,1.423,1.423V43
    A42.7,42.7 0 0,1 43,85.7A42.7,42.7 0 0,1 0.3,43A42.7,42.7 0 0,1 43,0.3z"/>
  <!-- Inset disc -->
  <circle fill="url(#disc)" cx="43" cy="43" r="32.025"/>
  <!-- Headphones with sound waves, after the Radio Paradise logo.
       Drawn on a 480x480 grid, scaled and centred in the disc. -->
  <g transform="translate(43,43) scale(0.105) translate(-240,-242.5)">
    <g fill="#C8C8C7">
      <path fill="none" stroke="#C8C8C7" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"
        d="M88,245L92,200A159,159 0 0,1 388,200L392,245"/>
      <rect x="60" y="225" width="68" height="175" rx="30"/>
      <rect x="352" y="225" width="68" height="175" rx="30"/>
      <rect x="18" y="262" width="40" height="100" rx="20"/>
      <rect x="422" y="262" width="40" height="100" rx="20"/>
    </g>
    <g fill="none" stroke="#FEB246" stroke-width="15" stroke-linecap="round">
      <path d="M150.1,289.7A30,30 0 0,1 150.1,334.3"/>
      <path d="M329.9,289.7A30,30 0 0,0 329.9,334.3"/>
      <path d="M168.8,268.9A58,58 0 0,1 168.8,355.1"/>
      <path d="M311.2,268.9A58,58 0 0,0 311.2,355.1"/>
      <path d="M187.5,248.1A86,86 0 0,1 187.5,375.9"/>
      <path d="M292.5,248.1A86,86 0 0,0 292.5,375.9"/>
      <path d="M206.3,227.3A114,114 0 0,1 206.3,396.7"/>
      <path d="M273.7,227.3A114,114 0 0,0 273.7,396.7"/>
    </g>
    <g fill="#FEB246">
      <circle cx="130" cy="312" r="19"/>
      <circle cx="350" cy="312" r="19"/>
    </g>
  </g>
</svg>
